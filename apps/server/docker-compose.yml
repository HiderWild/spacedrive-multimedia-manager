services:
  spacedrive:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: spacedrive-server
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "7373:7373"

    volumes:
      - spacedrive-data:/data
      # Optional: mount media (WSL example: /mnt/d/Media:/storage:ro)
      # - /mnt/storage:/storage:ro

    environment:
      - DATA_DIR=/data
      - PORT=8080
      - SD_AUTH=${SD_AUTH:-admin:changeme}
      - SD_P2P=true
      - RUST_LOG=info,sd_core=debug
      - TZ=UTC
      # Thumbnail throttling for bulk import (prevents OOM/freeze)
      - SD_THUMB_MAX_CONCURRENT=${SD_THUMB_MAX_CONCURRENT:-2}
      - SD_THUMB_BATCH_SIZE=${SD_THUMB_BATCH_SIZE:-16}
      # Optional: absolute path to an NVENC-capable ffmpeg binary
      # - FFMPEG_PATH=/usr/local/bin/ffmpeg-nvenc

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 1G
          # Uncomment with NVIDIA Container Toolkit (WSL2):
          # devices:
          #   - driver: nvidia
          #     count: 1
          #     capabilities: [gpu]

    # gpus: all

volumes:
  spacedrive-data:
    driver: local
